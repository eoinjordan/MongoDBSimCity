version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /native/android
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories:
      - /native/windows
      - /native/windows/tests
    schedule:
      interval: weekly